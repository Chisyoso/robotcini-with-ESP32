<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Te Invito IA</title>

<style>
body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial;
    padding:15px;
}

.container{max-width:720px;margin:auto;}

.card{
    background:#1b1b1b;
    border-radius:14px;
    padding:15px;
    margin-bottom:15px;
}

input,button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

input{background:#2a2a2a;color:white;}
button{background:#333;color:white;}

.chat{
    background:#222;
    padding:15px;
    border-radius:10px;
    margin-top:12px;
    min-height:140px;
    white-space:pre-wrap;
}

.mic{
    margin-top:10px;
    padding:10px;
    background:#222;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h2>Te Invito 🤖</h2>

<input id="message" placeholder="Mensaje">
<button onclick="talk()">Enviar</button>

<button onclick="toggleMic()">🎤 Micrófono</button>

<div id="chat" class="chat">Listo</div>

<div class="mic" id="micStatus">
Micrófono: OFF
</div>

</div>

</div>

<script>

let API_KEY = "";
let micStream = null;
let recognition = null;
let micReady = false;

// =========================
// INIT MIC (1 sola vez)
// =========================

async function initMic(){

    if(micReady) return true;

    try{

        micStream = await navigator.mediaDevices.getUserMedia({audio:true});

        const SpeechRecognition =
            window.SpeechRecognition || window.webkitSpeechRecognition;

        if(!SpeechRecognition){
            alert("No soporta voz");
            return false;
        }

        recognition = new SpeechRecognition();
        recognition.lang = "es-ES";
        recognition.continuous = true;
        recognition.interimResults = false;

        recognition.onresult = (e)=>{

            const text = e.results[e.results.length-1][0].transcript.toLowerCase();

            document.getElementById("chat").innerHTML = "🎤 " + text;

            handleVoice(text);

        };

        recognition.onerror = (e)=>{
            console.log("mic error",e);
        };

        micReady = true;

        return true;

    }catch(e){

        alert("Permiso de micrófono denegado");
        return false;
    }
}

// =========================
// MIC TOGGLE
// =========================

async function toggleMic(){

    const ok = await initMic();

    if(!ok) return;

    if(recognition.state === "recording"){
        recognition.stop();
        document.getElementById("micStatus").innerHTML = "Micrófono: OFF";
    }else{
        recognition.start();
        document.getElementById("micStatus").innerHTML = "Micrófono: ON";
    }
}

// =========================
// WAKE WORD FIX
// =========================

function handleVoice(text){

    // 🔥 wake word cambiado
    if(text.includes("te invito")){

        const clean = text.replace("te invito","").trim();

        if(clean){

            document.getElementById("message").value = clean;
            talk(clean);

        }
    }
}

// =========================
// IA (simple placeholder)
// =========================

async function talk(custom=null){

    const msg = custom || document.getElementById("message").value;

    document.getElementById("message").value="";

    document.getElementById("chat").innerHTML = "Pensando...";

    // 🔥 aquí puedes conectar OpenRouter 
    const reply = "Recibido: " + msg;

    document.getElementById("chat").innerHTML =
    "<b>Tú:</b> " + msg + "<br><br><b>Te Invito:</b> " + reply;

}

</script>

</body>
</html>
