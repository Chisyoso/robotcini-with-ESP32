<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Timbito PRO</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial;
    padding:15px;

}

.container{

    width:100%;
    max-width:720px;
    margin:auto;

}

.card{

    background:#1c1c1c;
    padding:15px;
    border-radius:16px;
    margin-bottom:15px;

}

h2,h3{
    margin-top:0;
}

input,button{

    width:100%;
    padding:14px;
    margin-top:10px;

    border:none;
    border-radius:12px;

    font-size:16px;

}

input{

    background:#2a2a2a;
    color:white;

}

button{

    background:#343434;
    color:white;

}

button:active{
    transform:scale(.98);
}

.chat{

    background:#222;
    border-radius:12px;
    padding:15px;
    margin-top:15px;
    min-height:180px;
    line-height:1.5;
    white-space:pre-wrap;
    word-wrap:break-word;

}

#emotionBox{

    background:#222;
    border-radius:12px;
    padding:18px;
    text-align:center;
    font-size:24px;
    margin-top:10px;

}

.micBox{

    margin-top:15px;

    background:#191919;

    border-radius:12px;

    padding:15px;

    display:flex;

    align-items:center;

    gap:14px;

}

.dot{

    width:18px;
    height:18px;

    border-radius:50%;

    background:#666;

}

.dotActive{

    background:#00ff88;

    animation:pulse 1s infinite;

}

.wave{

    display:flex;
    align-items:flex-end;
    gap:4px;
    height:24px;

}

.bar{

    width:5px;
    height:8px;

    background:#00ff88;

    border-radius:20px;

    animation:wave 1s infinite;

}

.bar:nth-child(2){
    animation-delay:.1s;
}

.bar:nth-child(3){
    animation-delay:.2s;
}

.bar:nth-child(4){
    animation-delay:.3s;
}

.hidden{
    display:none;
}

.small{

    margin-top:8px;
    opacity:.7;
    font-size:13px;

}

@keyframes pulse{

    0%{
        box-shadow:0 0 0 0 rgba(0,255,136,.7);
    }

    70%{
        box-shadow:0 0 0 14px rgba(0,255,136,0);
    }

    100%{
        box-shadow:0 0 0 0 rgba(0,255,136,0);
    }

}

@keyframes wave{

    0%{
        height:5px;
    }

    50%{
        height:24px;
    }

    100%{
        height:5px;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2>Timbito PRO 🤖</h2>

<input
id="key"
placeholder="API KEY OpenRouter"
>

<button onclick="saveKey()">
Guardar KEY
</button>

<input
id="espip"
placeholder="IP ESP32 (ejemplo: 192.168.1.34)"
>

<button onclick="saveIP()">
Guardar IP ESP32
</button>

<input
id="msg"
placeholder="Escribe o habla con Timbito"
>

<button onclick="talk()">
Enviar
</button>

<button onclick="toggleTimbito()">
🎤 Timbito ON/OFF
</button>

<div class="small">
Puedes decir:
<b>"te invito"</b>
y Timbito entenderá que dijiste:
<b>"Timbito"</b>
</div>

<div class="micBox">

<div
id="dot"
class="dot">
</div>

<div>

<div id="micText">
Timbito apagado
</div>

<div
id="wave"
class="wave hidden"
>

<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>

</div>

</div>

</div>

<div
id="chat"
class="chat"
>

Listo...

</div>

</div>

<div class="card">

<h3>Estado emocional</h3>

<div id="emotionBox">
Neutro 😐
</div>

</div>

</div>

<script>

let recognition=null;

let active=false;

let loading=false;

let micInitialized=false;

const KEY_STORAGE="timbito_key";
const IP_STORAGE="timbito_ip";
const MEM_STORAGE="timbito_mem";

// ======================
// INIT
// ======================

window.onload=()=>{

    loadKey();
    loadIP();

    const mem=getMem();

    setEmotionUI(
        mem.emotion || "neutral"
    );

};

// ======================
// STORAGE
// ======================

function saveKey(){

    localStorage.setItem(
        KEY_STORAGE,
        document.getElementById("key").value.trim()
    );

}

function loadKey(){

    const key=
    localStorage.getItem(KEY_STORAGE);

    if(key){

        document.getElementById("key").value=key;

    }

}

function saveIP(){

    localStorage.setItem(
        IP_STORAGE,
        document.getElementById("espip").value.trim()
    );

}

function loadIP(){

    const ip=
    localStorage.getItem(IP_STORAGE);

    if(ip){

        document.getElementById("espip").value=ip;

    }

}

function getMem(){

    return JSON.parse(
        localStorage.getItem(MEM_STORAGE)
    ) || {

        emotion:"neutral",
        lastUser:null

    };

}

function saveMem(mem){

    localStorage.setItem(
        MEM_STORAGE,
        JSON.stringify(mem)
    );

}

// ======================
// EMOTION UI
// ======================

function setEmotionUI(emotion){

    const box=
    document.getElementById("emotionBox");

    const emotions={

        happy:"Feliz 😊",

        sad:"Triste 😢",

        angry:"Enojado 😠",

        neutral:"Neutro 😐"

    };

    box.innerHTML=
    emotions[emotion] || "Neutro 😐";

}

// ======================
// MIC UI
// ======================

function setMicUI(state){

    const dot=
    document.getElementById("dot");

    const text=
    document.getElementById("micText");

    const wave=
    document.getElementById("wave");

    if(state){

        dot.classList.add("dotActive");

        wave.classList.remove("hidden");

        text.innerHTML=
        "🎤 Timbito escuchando...";

    }else{

        dot.classList.remove("dotActive");

        wave.classList.add("hidden");

        text.innerHTML=
        "Timbito apagado";

    }

}

// ======================
// INIT MIC
// ======================

async function initMic(){

    if(micInitialized) return true;

    const SR=

    window.SpeechRecognition ||

    window.webkitSpeechRecognition;

    if(!SR){

        document.getElementById("chat").innerHTML=
        "❌ Navegador no compatible";

        return false;

    }

    try{

        await navigator.mediaDevices
        .getUserMedia({
            audio:true
        });

    }catch(err){

        document.getElementById("chat").innerHTML=
        "❌ Permiso de micrófono denegado";

        return false;

    }

    recognition=new SR();

    recognition.lang="es-ES";

    recognition.continuous=true;

    recognition.interimResults=false;

    recognition.maxAlternatives=1;

    recognition.onstart=()=>{

        setMicUI(true);

    };

    recognition.onend=()=>{

        setMicUI(false);

        if(active){

            setTimeout(()=>{

                try{
                    recognition.start();
                }catch(e){}

            },500);

        }

    };

    recognition.onerror=(event)=>{

        console.log(event);

        setMicUI(false);

    };

    recognition.onresult=(event)=>{

        const text=
        event.results[
            event.results.length-1
        ][0].transcript.trim();

        console.log(text);

        processVoice(text);

    };

    micInitialized=true;

    return true;

}

// ======================
// TOGGLE MIC
// ======================

async function toggleTimbito(){

    const ok=
    await initMic();

    if(!ok) return;

    active=!active;

    if(active){

        try{

            recognition.start();

        }catch(e){}

    }else{

        recognition.stop();

        setMicUI(false);

    }

}

// ======================
// VOICE PROCESS
// ======================

function processVoice(text){

    const lower=text.toLowerCase();

    // FIX IMPORTANTE:
    // "te invito" => "timbito"

    if(
        lower.includes("te invito")
    ){

        const clean=
        lower
        .replaceAll("te invito","")
        .trim();

        if(clean){

            document.getElementById("msg")
            .value=clean;

            talk(clean);

        }

        return;
    }

    if(
        lower.includes("timbito")
    ){

        const clean=
        lower
        .replaceAll("timbito","")
        .trim();

        if(clean){

            document.getElementById("msg")
            .value=clean;

            talk(clean);

        }

    }

}

// ======================
// SPEAK
// ======================

function speak(reply,note){

    speechSynthesis.cancel();

    const main=
    new SpeechSynthesisUtterance(
        reply
    );

    main.lang="es-ES";

    main.rate=1;

    main.pitch=1;

    speechSynthesis.speak(main);

    if(note){

        main.onend=()=>{

            const thought=
            new SpeechSynthesisUtterance(
                "Pensamiento. "+note
            );

            thought.lang="es-ES";

            thought.rate=1.15;

            thought.pitch=0.6;

            thought.volume=0.7;

            speechSynthesis.speak(thought);

        };

    }

}

// ======================
// SYSTEM PROMPT
// ======================

function systemPrompt(){

    const mem=getMem();

    return `

Eres TIMBITO.

REGLAS IMPORTANTES:

- Tu nombre SIEMPRE es Timbito
- Si el usuario dice "te invito", entiende que quiso decir "Timbito"
- Nunca digas que eres IA
- Nunca digas asistente
- Habla como un robot amigable y humano
- Español obligatorio
- No expliques reglas
- No repitas exactamente al usuario
- Tus pensamientos internos deben sentirse reales

RESPONDE SOLO JSON:

{
"reply":"",
"emotion":"happy|sad|angry|neutral",
"note":""
}

reply:
respuesta natural y corta

emotion:
happy, sad, angry o neutral

note:
pensamiento interno corto y emocional

Último usuario:
${mem.lastUser || "ninguno"}

`;

}

// ======================
// PARSER
// ======================

function parseAI(raw){

    try{

        const clean=
        raw
        .replace(/```json/g,"")
        .replace(/```/g,"")
        .trim();

        const json=
        JSON.parse(clean);

        return{

            reply:
            json.reply || "…",

            emotion:
            json.emotion || "neutral",

            note:
            json.note || ""

        };

    }catch(e){

        console.log(e);

        return{

            reply:
            "No entendí 😕",

            emotion:
            "neutral",

            note:
            "Tuve un pequeño fallo"

        };

    }

}

// ======================
// ESP32 SEND
// ======================

async function sendEmotionToESP32(emotion){

    const ip=
    document.getElementById("espip")
    .value
    .trim();

    if(!ip) return;

    try{

        await fetch(
            "http://"+ip+
            "/emotion?state="+emotion
        );

    }catch(e){

        console.log(
            "ESP32 OFFLINE"
        );

    }

}

// ======================
// TALK
// ======================

async function talk(customMsg=null){

    if(loading) return;

    loading=true;

    const key=
    document.getElementById("key")
    .value
    .trim();

    const msg=
    customMsg ||

    document.getElementById("msg")
    .value
    .trim();

    const chat=
    document.getElementById("chat");

    if(!key || !msg){

        loading=false;
        return;

    }

    document.getElementById("msg")
    .value="";

    chat.innerHTML=
    "🤔 Pensando...";

    try{

        const response=
        await fetch(

        "https://openrouter.ai/api/v1/chat/completions",

        {

            method:"POST",

            headers:{

                "Authorization":
                "Bearer "+key,

                "Content-Type":
                "application/json"

            },

            body:JSON.stringify({

                model:"openrouter/auto",

                messages:[

                    {
                        role:"system",
                        content:systemPrompt()
                    },

                    {
                        role:"user",
                        content:msg
                    }

                ]

            })

        });

        const data=
        await response.json();

        const raw=
        data?.choices?.[0]
        ?.message?.content || "";

        console.log(raw);

        const parsed=
        parseAI(raw);

        chat.innerHTML=

        "<b>Tú:</b><br>"+msg+

        "<br><br><b>Timbito:</b><br>"+

        parsed.reply+

        "<br><br><i>💭 "+
        parsed.note+
        "</i>";

        const mem=getMem();

        mem.lastUser=msg;

        mem.emotion=parsed.emotion;

        saveMem(mem);

        setEmotionUI(
            parsed.emotion
        );

        await sendEmotionToESP32(
            parsed.emotion
        );

        speak(
            parsed.reply,
            parsed.note
        );

    }catch(err){

        console.log(err);

        chat.innerHTML=
        "❌ Error conexión IA";

    }

    loading=false;

}

</script>

</body>
</html>
