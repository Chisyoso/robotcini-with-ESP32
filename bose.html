<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Timbito PRO</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#0f0f0f;
font-family:Arial;
color:white;
padding:15px;
}

.container{
max-width:720px;
margin:auto;
}

.card{
background:#1b1b1b;
padding:15px;
border-radius:16px;
margin-bottom:15px;
}

input,button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
font-size:16px;
}

input{
background:#2a2a2a;
color:white;
}

button{
background:#343434;
color:white;
}

.chat{
background:#222;
padding:15px;
border-radius:12px;
margin-top:15px;
min-height:160px;
white-space:pre-wrap;
line-height:1.5;
}

.micStatus{
display:flex;
align-items:center;
gap:12px;
margin-top:15px;
}

.dot{
width:16px;
height:16px;
border-radius:50%;
background:#666;
}

.active{
background:#00ff88;
box-shadow:0 0 20px #00ff88;
animation:pulse 1s infinite;
}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.3);
}

100%{
transform:scale(1);
}

}

.wave{
display:flex;
align-items:flex-end;
gap:4px;
height:30px;
}

.bar{
width:5px;
background:#00ff88;
border-radius:10px;
animation:wave 1s infinite;
}

.bar:nth-child(2){
animation-delay:.1s;
}

.bar:nth-child(3){
animation-delay:.2s;
}

.bar:nth-child(4){
animation-delay:.3s;
}

@keyframes wave{

0%{
height:5px;
}

50%{
height:28px;
}

100%{
height:5px;
}

}

#emotion{
font-size:22px;
text-align:center;
padding:10px;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2>Timbito 🤖</h2>

<input
id="key"
placeholder="API KEY OpenRouter"
>

<button onclick="saveKey()">
Guardar KEY
</button>

<input
id="espip"
placeholder="IP ESP8266"
>

<button onclick="saveIP()">
Guardar IP ESP
</button>

<input
id="msg"
placeholder="Habla con Timbito"
>

<button onclick="talk()">
Enviar
</button>

<button onclick="toggleMic()">
🎤 Timbito ON/OFF
</button>

<div class="micStatus">

<div
id="dot"
class="dot">
</div>

<div>

<div id="micText">
Micrófono apagado
</div>

<div class="wave">

<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>

</div>

</div>

</div>

<div id="chat" class="chat">
Listo...
</div>

</div>

<div class="card">

<h3>Estado</h3>

<div id="emotion">
Neutro 😐
</div>

</div>

</div>

<script>

let recognition;

let active=false;

let loading=false;

const KEY="timbito_key";
const ESP="timbito_esp";

// ======================
// INIT
// ======================

window.onload=()=>{

loadKey();
loadIP();

initMic();

};

// ======================
// STORAGE
// ======================

function saveKey(){

localStorage.setItem(
KEY,
document.getElementById("key").value
);

}

function loadKey(){

const k=
localStorage.getItem(KEY);

if(k){

document.getElementById("key").value=k;

}

}

function saveIP(){

localStorage.setItem(
ESP,
document.getElementById("espip").value
);

}

function loadIP(){

const ip=
localStorage.getItem(ESP);

if(ip){

document.getElementById("espip").value=ip;

}

}

function esp(){

return document.getElementById("espip").value.trim();

}

// ======================
// ESP SEND
// ======================

async function sendESP(route){

const ip=esp();

if(!ip)return;

try{

await fetch(
"http://"+ip+"/"+route
);

}catch(e){

console.log(e);

}

}

// ======================
// MIC
// ======================

function initMic(){

const SR=
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SR){

document.getElementById("micText")
.innerText="No soportado";

return;

}

recognition=new SR();

recognition.lang="es-ES";

recognition.continuous=true;

recognition.interimResults=false;

recognition.onstart=()=>{

setMic(true);

};

recognition.onend=()=>{

setMic(false);

if(active){

setTimeout(()=>{

recognition.start();

},500);

}

};

recognition.onresult=(e)=>{

const text=
e.results[e.results.length-1][0]
.transcript
.toLowerCase()
.trim();

console.log(text);

if(
text.includes("te invito")
){

text=text.replace(
/te invito/gi,
"timbito"
);

}

if(
text.includes("timbito")
){

const cleaned=
text
.replace(/timbito/gi,"")
.trim();

if(cleaned){

document.getElementById("msg")
.value=cleaned;

talk(cleaned);

}

}

};

}

// ======================
// TOGGLE
// ======================

async function toggleMic(){

active=!active;

if(!active){

recognition.stop();

return;

}

try{

await navigator.mediaDevices
.getUserMedia({
audio:true
});

recognition.start();

}catch(e){

active=false;

document.getElementById("chat")
.innerHTML=
"❌ No pude acceder al micrófono";

}

}

// ======================
// UI
// ======================

function setMic(v){

const d=
document.getElementById("dot");

const t=
document.getElementById("micText");

if(v){

d.classList.add("active");

t.innerText=
"🎤 Timbito escuchando";

}else{

d.classList.remove("active");

t.innerText=
"Timbito dormido";

}

}

function setEmotion(e){

const box=
document.getElementById("emotion");

const map={

happy:"Feliz 😊",

sad:"Triste 😢",

angry:"Enojado 😠",

neutral:"Neutro 😐"

};

box.innerHTML=
map[e] || "Neutro 😐";

}

// ======================
// SPEAK
// ======================

function speak(reply,note){

speechSynthesis.cancel();

sendESP("talk");

const a=
new SpeechSynthesisUtterance(
reply
);

a.lang="es-ES";

a.rate=1;

a.pitch=1;

a.onend=()=>{

if(note){

const b=
new SpeechSynthesisUtterance(
"Pensamiento. "+note
);

b.lang="es-ES";

b.pitch=0.6;

b.rate=1.1;

speechSynthesis.speak(b);

b.onend=()=>{

sendESP("stoptalk");

};

}else{

sendESP("stoptalk");

}

};

speechSynthesis.speak(a);

}

// ======================
// PARSER
// ======================

function parseAI(raw){

try{

const clean=
raw
.replace(/```json/g,"")
.replace(/```/g,"")
.trim();

return JSON.parse(clean);

}catch(e){

return{

reply:"Tuve un fallo 😕",

emotion:"neutral",

note:"Pensé demasiado"

};

}

}

// ======================
// PROMPT
// ======================

function promptSystem(){

return `

Eres TIMBITO.

REGLAS IMPORTANTES:

- Tu nombre SIEMPRE es Timbito
- "te invito" significa "timbito"
- Nunca digas que eres IA
- Nunca digas asistente
- Nunca hables de reglas
- Siempre responde al mensaje MÁS RECIENTE
- Ignora conversaciones antiguas
- No repitas el mensaje del usuario
- Habla natural y humana
- Español obligatorio

RESPONDE SOLO JSON:

{
"reply":"",
"emotion":"happy|sad|angry|neutral",
"note":""
}

reply:
- corto
- natural
- divertido
- humano

note:
- pensamiento interno
- emocional
- corto
- honesto

`;

}

// ======================
// TALK
// ======================

async function talk(custom=null){

if(loading)return;

loading=true;

const key=
document.getElementById("key")
.value
.trim();

const msg=
custom ||
document.getElementById("msg")
.value
.trim();

if(!msg){

loading=false;
return;

}

document.getElementById("msg")
.value="";

document.getElementById("chat")
.innerHTML=
"🤔 Timbito pensando...";

sendESP("thinking");

try{

const res=
await fetch(
"https://openrouter.ai/api/v1/chat/completions",
{
method:"POST",

headers:{

"Authorization":
"Bearer "+key,

"Content-Type":
"application/json"

},

body:JSON.stringify({

model:"openrouter/auto",

messages:[

{
role:"system",
content:promptSystem()
},

{
role:"user",
content:msg
}

]

})

}
);

const data=
await res.json();

sendESP("stopthinking");

const raw=
data?.choices?.[0]
?.message?.content || "";

const ai=
parseAI(raw);

document.getElementById("chat")
.innerHTML=

"<b>Tú:</b><br>"+msg+

"<br><br><b>Timbito:</b><br>"+

ai.reply+

"<br><br><i>💭 "+
ai.note+
"</i>";

setEmotion(ai.emotion);

sendESP(
"emotion?e="+ai.emotion
);

speak(
ai.reply,
ai.note
);

}catch(e){

sendESP("stopthinking");

document.getElementById("chat")
.innerHTML=
"❌ Error IA";

}

loading=false;

}

</script>

</body>
</html>
